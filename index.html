<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/viewer/assets/brand/syuzhet-loom-mark-light.svg" />
    <link rel="icon" type="image/svg+xml" href="/src/viewer/assets/brand/syuzhet-loom-mark-dark.svg" media="(prefers-color-scheme: dark)" />
    <title>Syuzhet Loom</title>
    <script>
      // apply a chosen theme before the first paint, so a dark choice does not flash light
      try {
        var t = localStorage.getItem('syuzhet-loom-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
